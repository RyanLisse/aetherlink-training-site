<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Evidence rule</title><desc id="desc">Claim, source, reproduced check, reviewer; anything short of that is a hypothesis and stays OPEN.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
<text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">EVIDENCE RULE</text>
<text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">a claim only counts with a source, a reproduced check and a reviewer</text>
<rect x="790" y="88" width="198.79999999999998" height="26" rx="13" fill="#1f1e2e"/>
<text x="889.4" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#fff">CUTOFF 2026-09-10 12:00</text>
<rect x="120" y="220" width="760" height="10" rx="5" fill="#5b3fff" opacity=".18"/>
<circle cx="190" cy="225" r="32" fill="#ffffff" stroke="#5b3fff" stroke-width="3"/>
<text x="190" y="234" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#5b3fff">1</text>
<text x="190" y="287" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">CLAIM</text>
<text x="190" y="309" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">what you say happened</text>
<circle cx="396" cy="225" r="32" fill="#ffffff" stroke="#5b3fff" stroke-width="3"/>
<text x="396" y="234" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#5b3fff">2</text>
<text x="396" y="287" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">SOURCE</text>
<text x="396" y="309" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">row id · file · cutoff</text>
<circle cx="602" cy="225" r="32" fill="#ffffff" stroke="#5b3fff" stroke-width="3"/>
<text x="602" y="234" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#5b3fff">3</text>
<text x="602" y="287" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">REPRODUCED CHECK</text>
<text x="602" y="309" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">command · calculation · sheet</text>
<circle cx="808" cy="225" r="32" fill="#fff1e6" stroke="#ff7a1a" stroke-width="3"/>
<text x="808" y="234" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#aa4300">4</text>
<text x="808" y="287" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#aa4300">REVIEWER</text>
<text x="808" y="309" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">someone else reran it</text>
<rect x="150" y="380" width="700" height="80" rx="14" fill="#fbfafc" stroke="#dedbea" stroke-width="2" stroke-dasharray="8 6"/>
<text x="500" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#625d73">HYPOTHESIS</text>
<text x="500" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f1e2e">a claim without source, check and reviewer stays OPEN — say so, do not soften it</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">POINT AT THE ROW · SHOW THE COMMAND · NAME THE REVIEWER</text>
</svg>
