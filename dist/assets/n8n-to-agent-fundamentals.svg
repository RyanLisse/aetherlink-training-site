  <text x="340.0" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">{{ $json.customer }} · message</text>
  <g filter="url(#shadow)"><rect x="540" y="252" width="300" height="104" rx="14" fill="#fff4ec" stroke="#dedbea"/></g>
  <text x="690.0" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f1e2e">Input · incl. ticket_id</text>
  <text x="690.0" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">[gap] n8n forgot it</text>
  <g filter="url(#shadow)"><rect x="890" y="252" width="280" height="104" rx="14" fill="#eeeafe" stroke="#dedbea"/></g>
  <text x="1030.0" y="296" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f1e2e">prompt</text>
  <text x="1030.0" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">buildTriagePrompt(ticket)</text>
  <line x1="494" y1="304.0" x2="534" y2="304.0" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="844" y1="304.0" x2="884" y2="304.0" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="30" y="425.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">TOOLS</text>
  <g filter="url(#shadow)"><rect x="190" y="366" width="300" height="104" rx="14" fill="#f6f5f9" stroke="#dedbea"/></g>
  <text x="340.0" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f1e2e">Customer Reply Agent</text>
  <text x="340.0" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">Risk Agent · ai_tool</text>
  <g filter="url(#shadow)"><rect x="540" y="366" width="300" height="104" rx="14" fill="#fff4ec" stroke="#dedbea"/></g>
  <text x="690.0" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f1e2e">Success check 2</text>
  <text x="690.0" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">each exactly once, traced</text>
  <g filter="url(#shadow)"><rect x="890" y="366" width="280" height="104" rx="14" fill="#eeeafe" stroke="#dedbea"/></g>
  <text x="1030.0" y="410" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f1e2e">options.agents + Agent</text>
  <text x="1030.0" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">2 subagents · src/tools.ts</text>
  <line x1="494" y1="418.0" x2="534" y2="418.0" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="844" y1="418.0" x2="884" y2="418.0" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="30" y="539.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">MEMORY</text>
  <g filter="url(#shadow)"><rect x="190" y="480" width="300" height="104" rx="14" fill="#f6f5f9" stroke="#dedbea"/></g>
  <text x="340.0" y="524" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f1e2e">Simple Memory × 3</text>
  <text x="340.0" y="554" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">static keys 1 · 2 · 1</text>
  <g filter="url(#shadow)"><rect x="540" y="480" width="300" height="104" rx="14" fill="#fff4ec" stroke="#dedbea"/></g>
  <text x="690.0" y="524" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f1e2e">Success check 7</text>
  <text x="690.0" y="554" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">per ticket, human-readable</text>
  <g filter="url(#shadow)"><rect x="890" y="480" width="280" height="104" rx="14" fill="#eeeafe" stroke="#dedbea"/></g>
  <text x="1030.0" y="524" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f1e2e">memory/WL-1026.md</text>
  <text x="1030.0" y="554" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">+ memory/MEMORY.md</text>
  <line x1="494" y1="532.0" x2="534" y2="532.0" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="844" y1="532.0" x2="884" y2="532.0" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="600" y="608" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">git diff step-2-design → step-3a (system + prompt) → step-3b (tools) → step-3c (memory)</text>
