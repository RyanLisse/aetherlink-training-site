<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-native SDLC loop</title><desc id="desc">A standalone six-phase AI-native software delivery loop with Claude at the centre.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter>
  </defs>
  <rect width="900" height="900" fill="#ffffff"/>
<text x="450" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#5b3fff">AI-NATIVE SDLC</text>
<text x="450" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">AI helps at every point · humans govern the loop</text>
<g transform="translate(450 470)">
<circle r="290" fill="none" stroke="#ff7a1a" stroke-width="14" stroke-dasharray="90 26" stroke-linecap="round"/>
<circle cx="0" cy="-268" r="62" fill="#1f1e2e" stroke="#dedbea" stroke-width="1.5"/><text x="0" y="-261" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fbfafc">PLAN</text>
<circle cx="232" cy="-134" r="62" fill="#1f1e2e" stroke="#dedbea" stroke-width="1.5"/><text x="232" y="-127" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fbfafc">DESIGN</text>
<circle cx="232" cy="134" r="62" fill="#1f1e2e" stroke="#dedbea" stroke-width="1.5"/><text x="232" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fbfafc">BUILD</text>
<circle cx="0" cy="268" r="62" fill="#1f1e2e" stroke="#dedbea" stroke-width="1.5"/><text x="0" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fbfafc">TEST</text>
<circle cx="-232" cy="134" r="62" fill="#1f1e2e" stroke="#dedbea" stroke-width="1.5"/><text x="-232" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fbfafc">DEPLOY</text>
<circle cx="-232" cy="-134" r="62" fill="#1f1e2e" stroke="#dedbea" stroke-width="1.5"/><text x="-232" y="-127" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fbfafc">MAINTAIN</text>
<circle r="120" fill="#ff7a1a"/>
<text y="12" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#1f1e2e">Claude</text>
<text y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">HELPS AT EVERY POINT</text>
</g>
<text x="450" y="860" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">INTENT · REVIEW · RELEASE STAY HUMAN DECISIONS</text>
</svg>
