<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Inside the harness</title><desc id="desc">The reason, act, observe loop with the model doing reason and the harness doing act and observe, the one boolean that turns a chatbot into an agent, and the five primitive tools of every coding harness.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter></defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">INSIDE THE HARNESS</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">an LLM, a loop, and enough tokens · the rest is engineering</text>
<rect x="70" y="100" width="520" height="250" rx="16" fill="none" stroke="#dedbea" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="330" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#625d73">THE LOOP · reason → act → observe → repeat</text>
<rect x="95" y="150" width="150" height="70" rx="12" fill="#ff7a1a"/>
<text x="170" y="182" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f1e2e">REASON</text>
<text x="170" y="201" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#1f1e2e">the model chooses an action</text>
<path d="M245 185L268 185" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="270" y="150" width="150" height="70" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="345.0" y="182.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">ACT</text>
<text x="345.0" y="202.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">the harness runs the tool</text>
<path d="M420 185L443 185" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="445" y="150" width="130" height="70" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="510.0" y="182.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">OBSERVE</text>
<text x="510.0" y="202.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">result → context</text>
<path d="M510 220V262H170V222" fill="none" stroke="#5b3fff" stroke-width="3" marker-end="url(#ap)"/>
<text x="340" y="283" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b3fff">REPEAT · no waiting for the user</text>
<text x="330" y="320" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1f1e2e">readUserInput = false</text>
<text x="330" y="338" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#625d73">that one boolean is the difference between a chatbot and an agent</text>
<text x="795" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b3fff">FIVE PRIMITIVES</text>
<text x="795" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#625d73">of every coding harness, in the order you add them</text>
<rect x="640" y="156" width="150" height="32" rx="16.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="715.0" y="177.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#fff">1 · read_file</text>
<text x="800" y="177" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#1f1e2e">file into the context window</text>
<rect x="640" y="198" width="150" height="32" rx="16.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="715.0" y="219.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">2 · list_files</text>
<text x="800" y="219" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#1f1e2e">the model chains 1 + 2 by itself</text>
<rect x="640" y="240" width="150" height="32" rx="16.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="715.0" y="261.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">3 · bash</text>
<text x="800" y="261" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#1f1e2e">where sandbox and guardrails begin</text>
<rect x="640" y="282" width="150" height="32" rx="16.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="715.0" y="303.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">4 · edit_file</text>
<text x="800" y="303" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#1f1e2e">string replace, exactly one match</text>
<rect x="640" y="324" width="150" height="32" rx="16.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="715.0" y="345.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">5 · code_search</text>
<text x="800" y="345" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#1f1e2e">ripgrep under the hood</text>
<rect x="70" y="380" width="860" height="1.5" fill="#dedbea"/>
<text x="500" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#625d73">WHAT PRODUCTION ADDS ON TOP OF THE 300 LINES</text>
<rect x="70" y="430" width="135" height="36" rx="18.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="137.5" y="453.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">sandbox</text>
<rect x="215" y="430" width="135" height="36" rx="18.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="282.5" y="453.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">session memory</text>
<rect x="360" y="430" width="135" height="36" rx="18.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="427.5" y="453.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">verification loops</text>
<rect x="505" y="430" width="135" height="36" rx="18.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="572.5" y="453.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">approvals</text>
<rect x="650" y="430" width="135" height="36" rx="18.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="717.5" y="453.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">observability</text>
<rect x="795" y="430" width="135" height="36" rx="18.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="862.5" y="453.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">lifecycle</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13"  fill="#1f1e2e">95% per step × 20 steps = 36% end to end. Verification, retries and checkpoints are what stop that compounding.</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">300 LINES AND THREE TOOLS TALK TO THE MODEL · EVERYTHING ELSE MAKES IT RELIABLE</text>
</svg>
