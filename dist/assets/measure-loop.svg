<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Measure the loop</title><desc id="desc">Scattered runs with different prompts and settings cannot be compared; aligned runs with the same prompt and sequence can, and three constants are logged per run.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter></defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">MEASURE THE LOOP</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">same prompt · same sequence · every run · then three constants</text>
<text x="250" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#625d73">SCATTERED · nothing comparable</text>
<rect x="110" y="180" width="28" height="70" rx="6" fill="#dedbea"/>
<text x="124" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">p1</text>
<rect x="158" y="195" width="28" height="55" rx="6" fill="#dedbea"/>
<text x="172" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">p2</text>
<rect x="206" y="195" width="28" height="55" rx="6" fill="#dedbea"/>
<text x="220" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">p3</text>
<rect x="254" y="180" width="28" height="70" rx="6" fill="#dedbea"/>
<text x="268" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">p4</text>
<rect x="302" y="225" width="28" height="25" rx="6" fill="#dedbea"/>
<text x="316" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">p5</text>
<rect x="350" y="195" width="28" height="55" rx="6" fill="#dedbea"/>
<text x="364" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">p6</text>
<text x="250" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#625d73">different prompt, model or harness each time</text>
<text x="730" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b3fff">ALIGNED · a constant to hill-climb</text>
<rect x="590" y="180" width="28" height="70" rx="6" fill="#5b3fff"/>
<text x="604" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">run 1</text>
<rect x="638" y="186" width="28" height="64" rx="6" fill="#5b3fff"/>
<text x="652" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">run 2</text>
<rect x="686" y="192" width="28" height="58" rx="6" fill="#5b3fff"/>
<text x="700" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">run 3</text>
<rect x="734" y="198" width="28" height="52" rx="6" fill="#5b3fff"/>
<text x="748" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">run 4</text>
<rect x="782" y="204" width="28" height="46" rx="6" fill="#5b3fff"/>
<text x="796" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">run 5</text>
<rect x="830" y="210" width="28" height="40" rx="6" fill="#ff7a1a"/>
<text x="844" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10"  fill="#625d73">run 6</text>
<text x="730" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#625d73">same prompt, same sequence; only one thing changes per run</text>
<rect x="120" y="330" width="760" height="1.5" fill="#dedbea"/>
<rect x="120" y="352" width="230" height="40" rx="20.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="235.0" y="377.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#fff">TOKENS + TOOL CALLS</text>
<text x="370" y="377" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14"  fill="#1f1e2e">per completed task</text>
<text x="620" y="377" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#625d73">one harness: 32 calls · another: 19 · same answer</text>
<rect x="120" y="414" width="230" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="235.0" y="439.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#413380">REVIEW ITERATIONS</text>
<text x="370" y="439" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14"  fill="#1f1e2e">per pull request</text>
<text x="620" y="439" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#625d73">how many rounds before a clean score</text>
<rect x="120" y="476" width="230" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="235.0" y="501.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#413380">COST</text>
<text x="370" y="501" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14"  fill="#1f1e2e">per successful task</text>
<text x="620" y="501" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#625d73">not per run, not per token</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">YOU CANNOT SAY 'IT GOT BETTER' UNTIL TWO RUNS ARE COMPARABLE</text>
</svg>
