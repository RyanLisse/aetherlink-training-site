<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">MOB programming</title><desc id="desc">Four rotating roles on one chain: driver, navigator, researcher, tester, around one laptop.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
<text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">MOB PROGRAMMING</text>
<text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">one laptop · one screen · everyone in a role</text>
<rect x="94.0" y="120" width="192.0" height="30" rx="10" fill="#1f1e2e" stroke="#ff7a1a" stroke-width="2"/>
<text x="190" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#fff">ROTATE EVERY 5–7 MIN</text>
<text x="190" y="166" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ff7a1a">▼</text>
<rect x="120" y="235" width="760" height="10" rx="5" fill="#5b3fff" opacity=".18"/>
<circle cx="190" cy="240" r="32" fill="#fff1e6" stroke="#ff7a1a" stroke-width="3"/>
<text x="190" y="249" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#aa4300">1</text>
<text x="190" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#aa4300">DRIVER</text>
<text x="190" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">types what the navigator says</text>
<circle cx="396" cy="240" r="32" fill="#ffffff" stroke="#5b3fff" stroke-width="3"/>
<text x="396" y="249" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#5b3fff">2</text>
<text x="396" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">NAVIGATOR</text>
<text x="396" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">thinks out loud</text>
<circle cx="602" cy="240" r="32" fill="#ffffff" stroke="#5b3fff" stroke-width="3"/>
<text x="602" y="249" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#5b3fff">3</text>
<text x="602" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">RESEARCHER</text>
<text x="602" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">brings the outside view</text>
<circle cx="808" cy="240" r="32" fill="#ffffff" stroke="#5b3fff" stroke-width="3"/>
<text x="808" y="249" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#5b3fff">4</text>
<text x="808" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f1e2e">TESTER</text>
<text x="808" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#625d73">checks the evidence</text>
<rect x="300" y="400" width="400" height="64" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="500.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f1e2e">One laptop · one screen</text>
<text x="500.0" y="450.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">the shared source of truth in the room</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">"PAUSE" = RE-NAME THE SOURCE, THE ASSUMPTION OR THE EVIDENCE</text>
</svg>
