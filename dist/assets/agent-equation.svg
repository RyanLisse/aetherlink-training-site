<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent equals model plus harness</title><desc id="desc">An equation: model plus harness equals agent, with three analogy rows (brain and body, CPU and operating system, engine and car) and the reminder that saying I use Claude names the harness.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter></defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">AGENT = MODEL + HARNESS</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">if you are not the model, you are the harness</text>
<rect x="70" y="105" width="230" height="74" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="185.0" y="139.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">MODEL</text>
<text x="185.0" y="159.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">reasons, predicts, plans tool calls</text>
<rect x="70" y="105" width="230" height="74" rx="12" fill="#ff7a1a" opacity=".95"/>
<text x="185" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">MODEL</text>
<text x="185" y="158" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#1f1e2e">reasons, predicts, plans tool calls</text>
<text x="322" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1f1e2e">+</text>
<rect x="345" y="105" width="300" height="74" rx="12" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="495.0" y="139.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#fff">HARNESS</text>
<text x="495.0" y="159.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#e4dcff">everything that is not the model</text>
<text x="667" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1f1e2e">=</text>
<rect x="690" y="105" width="240" height="74" rx="12" fill="#ffffff" stroke="#5b3fff" stroke-width="2.5"/>
<text x="810" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">AGENT</text>
<text x="810" y="158" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12"  fill="#625d73">runs tools in a loop to reach a goal</text>
<text x="185" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#625d73">no memory · no tools · no way to act</text>
<text x="495" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#625d73">prompts · tools · memory · sandbox · guardrails · observability</text>
<text x="810" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#625d73">the complete working system</text>
<rect x="70" y="228" width="860" height="1.5" fill="#dedbea"/>
<rect x="70" y="252" width="230" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="185.0" y="277.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#413380">BRAIN</text>
<rect x="345" y="252" width="300" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="495.0" y="277.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">BODY · WORKPLACE · SAFETY</text>
<rect x="690" y="252" width="240" height="40" rx="20.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="810.0" y="277.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#fff">THE PERSON who thinks and acts</text>
<rect x="70" y="318" width="230" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="185.0" y="343.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#413380">CPU</text>
<rect x="345" y="318" width="300" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="495.0" y="343.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">OPERATING SYSTEM · context window = RAM</text>
<rect x="690" y="318" width="240" height="40" rx="20.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="810.0" y="343.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#fff">THE APPLICATION running on it</text>
<rect x="70" y="384" width="230" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="185.0" y="409.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#413380">ENGINE</text>
<rect x="345" y="384" width="300" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="495.0" y="409.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#413380">THE CAR · wheel, brakes, fuel, electronics</text>
<rect x="690" y="384" width="240" height="40" rx="20.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="810.0" y="409.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#fff">THE CAR DRIVING</text>
<text x="500" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f1e2e">"I use Claude / ChatGPT / Cursor" names the harness, not the model.</text>
<text x="500" y="492" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13"  fill="#625d73">You swap the model inside the harness. The harness is the layer you actually work with.</text>
<text x="500" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13"  fill="#625d73">"Agents run tools in a loop to achieve a goal." · Simon Willison</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">WITHOUT A HARNESS YOU HAVE A CHAT · WITH ONE YOU HAVE WORK THAT FINISHES</text>
</svg>
