<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Hooks as build-time guardrails</title><desc id="desc">A skill advises; a hook is the deterministic layer behind it. Every matching action during the build passes through the hook, which blocks, formats or lets it through. Heavy checks and human approval belong at later gates.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter></defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">HOOKS AS BUILD-TIME GUARDRAILS</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">a skill advises · a hook enforces · every matching action passes through it</text>
<rect x="60" y="150" width="200" height="70" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="160.0" y="182.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f1e2e">Skill</text>
<text x="160.0" y="202.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">advisory · your ticket-refinement skill</text>
<path d="M260 185L318 185" fill="none" stroke="#5b3fff" stroke-width="3" marker-end="url(#ap)"/>
<rect x="320" y="110" width="220" height="150" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="430.0" y="191.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f1e2e"></text>
<text x="430" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b3fff">HOOK · DETERMINISTIC</text>
<text x="430" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f1e2e">runs on each matching action</text>
<text x="430" y="192" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">fast · scoped to the changed file</text>
<text x="430" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">edits · shell commands</text>
<text x="430" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">no exception, no reminder needed</text>
<path d="M540 150L618 120" fill="none" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ao)"/>
<path d="M540 185L618 185" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M540 220L618 250" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="620" y="100" width="300" height="40" rx="20.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="770.0" y="125.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#fff">BLOCK · protected path, secret in diff</text>
<rect x="620" y="165" width="300" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="770.0" y="190.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#413380">FIX · run formatter and linter after edit</text>
<rect x="620" y="230" width="300" height="40" rx="20.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="770.0" y="255.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#413380">ALLOW · everything else, logged</text>
<rect x="60" y="320" width="880" height="1.5" fill="#dedbea"/>
<text x="500" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#625d73">WHERE EACH CONTROL LIVES</text>
<rect x="100" y="372" width="240" height="44" rx="22.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="220.0" y="399.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#fff">BUILD</text>
<text x="220" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">hooks: block · format · scrub</text>
<rect x="380" y="372" width="240" height="44" rx="22.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="500.0" y="399.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#413380">COMMIT / PR</text>
<text x="500" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">full test suite · review</text>
<rect x="660" y="372" width="240" height="44" rx="22.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="780.0" y="399.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#413380">DEPLOY</text>
<text x="780" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">human approval gates</text>
<path d="M340 394L378 394" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M620 394L658 394" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="250" y="470" width="500" height="60" rx="12" fill="#fff1e6" stroke="#ff7a1a" stroke-width="1.5"/>
<text x="500.0" y="497.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1f1e2e">An approval prompt during the build stalls every parallel session</text>
<text x="500.0" y="517.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">put the human at the deploy gate, not in the build loop</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">SKILL = ADVISORY · HOOK = MUST HOLD · KEEP IT FAST AND SCOPED</text>
</svg>
