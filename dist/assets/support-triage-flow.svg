<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Support triage flow</title>
  <desc id="desc">A fictional ticket enters a coordinator, which always calls customer reply and risk specialists; strict JSON is validated, routed by priority, and waits at a human gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2.5" fill="#5b3fff">SUPPORT TRIAGE · WL-1026</text>
  <text x="600" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#625d73">visible result · specialists always called · JSON gate before a draft</text>

  <g filter="url(#shadow)"><rect x="40" y="230" width="190" height="100" rx="14" fill="#eeeafe" stroke="#dedbea"/></g>
  <rect x="40" y="230" width="190" height="3" fill="#5b3fff"/>
  <text x="135" y="263" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#5b3fff">TICKET INPUT</text>
  <text x="135" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1f1e2e">WL-1026 · Maarten</text>
  <text x="135" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#625d73">charged twice · fictional</text>

  <path d="M230 280H310" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="315" y="190" width="260" height="180" rx="14" fill="#ffffff" stroke="#ff7a1a"/></g>
  <rect x="315" y="190" width="260" height="3" fill="#ff7a1a"/>
  <text x="445" y="226" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#aa4300">COORDINATOR</text>
  <text x="445" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1f1e2e">Analyze + decide</text>
  <text x="445" y="283" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#625d73">priority · sentiment</text>
  <text x="445" y="305" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#625d73">recommended_action</text>
  <text x="445" y="339" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#aa4300">both specialists are required</text>

  <path d="M445 370V410" fill="none" stroke="#ff7a1a" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <g filter="url(#shadow)"><rect x="300" y="415" width="290" height="96" rx="14" fill="#fff1e6" stroke="#ff7a1a"/></g>
  <text x="445" y="445" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#aa4300">SPECIALISTS</text>
  <text x="445" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1f1e2e">Customer Reply + Risk</text>
  <text x="445" y="492" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#625d73">reply draft · risk_note</text>
  <path d="M590 463C640 430 635 325 575 305" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#orange-arrow)"/>

  <path d="M575 280H655" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="660" y="210" width="220" height="140" rx="14" fill="#ffffff" stroke="#5b3fff"/></g>
  <rect x="660" y="210" width="220" height="3" fill="#5b3fff"/>
  <text x="770" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#5b3fff">VALIDATE JSON</text>
  <text x="770" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1f1e2e">preserve ticket_id</text>
  <text x="770" y="298" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1f1e2e">preserve risk_note</text>
  <text x="770" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#413380">low · medium · high only</text>

  <path d="M880 280H960" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="965" y="185" width="190" height="190" rx="14" fill="#ffffff" stroke="#dedbea"/></g>
  <rect x="965" y="185" width="190" height="3" fill="#ff7a1a"/>
  <text x="1060" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#aa4300">PRIORITY SWITCH</text>
  <text x="1060" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1f1e2e">low → auto_reply</text>
  <text x="1060" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1f1e2e">medium → investigate</text>
  <text x="1060" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1f1e2e">high → escalate</text>
  <text x="1060" y="348" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#625d73">draft only</text>

  <path d="M1060 375V420" fill="none" stroke="#ff7a1a" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <rect x="865" y="425" width="310" height="78" rx="14" fill="#5b3fff"/>
  <text x="1020" y="456" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#fff">HUMAN GATE</text>
  <text x="1020" y="480" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff">draft only · no send · no refund</text>
  <text x="600" y="583" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1.8" fill="#aa4300">FICTIONAL DATA · STATIC MEMORY KEYS NOT ISOLATED · RECORD THE RUN</text>
</svg>
