<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Human gate</title><desc id="desc">Agent output waits at a human gate; accept or return with a named reason; nothing is written without that decision.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
<text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">HUMAN GATE</text>
<text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">the agent proposes · a human decides · nothing is written without the gate</text>
<rect x="60" y="250" width="230" height="84" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="175.0" y="288.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f1e2e">Agent output</text>
<text x="175.0" y="310.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">draft · preview · trace</text>
<path d="M290 292L372 292" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="380" y="200" width="250" height="184" rx="12" fill="#fff1e6" stroke="#ff7a1a" stroke-width="1.5"/>
<text x="505.0" y="298.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f1e2e"></text>
<text x="505" y="240" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#aa4300">HUMAN GATE</text>
<circle cx="505" cy="300" r="34" fill="#ff7a1a"/><path d="M489 300l11 11 22-24" fill="none" stroke="#1f1e2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">source · check · reviewer named</text>
<path d="M630 262L718 232" fill="none" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ao)"/>
<path d="M630 322L718 352" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="720" y="206" width="220" height="52" rx="26.0" fill="#5b3fff" stroke="#5b3fff" stroke-width="1.5"/>
<text x="830.0" y="237.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#fff">ACCEPT</text>
<rect x="720" y="326" width="220" height="52" rx="26.0" fill="#ffffff" stroke="#c9c0f7" stroke-width="1.5"/>
<text x="830.0" y="357.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#413380">RETURN · NAMED REASON</text>
<path d="M830 378C830 470 175 470 175 336" fill="none" stroke="#5b3fff" stroke-width="3" marker-end="url(#ap)"/>
<text x="500" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625d73">repeat · back to the agent with the gap named</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">NO BUSINESS-SYSTEM WRITE WITHOUT THIS DECISION</text>
</svg>
