<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Holdout scenarios</title><desc id="desc">Agents write code and tests inside the codebase; end-to-end scenarios live in a sealed box outside it and are scored as satisfaction, not pass or fail.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#625d73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff7a1a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b3fff"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f1e2e" flood-opacity=".06"/></filter></defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5b3fff">HOLDOUT SCENARIOS</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625d73">if agents write the code and the tests, what stops 'assert true'?</text>
<rect x="70" y="120" width="500" height="330" rx="16" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="320" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b3fff">THE CODEBASE · agents work here</text>
<rect x="110" y="185" width="200" height="64" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="210.0" y="214.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">Agent writes code</text>
<text x="210.0" y="234.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">one bounded slice</text>
<rect x="340" y="185" width="200" height="64" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="440.0" y="214.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f1e2e">Agent writes tests</text>
<text x="440.0" y="234.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">green by construction</text>
<path d="M310 217L338 217" fill="none" stroke="#625d73" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="110" y="290" width="430" height="60" rx="12" fill="#eeeafe" stroke="#dedbea" stroke-width="1.5"/>
<text x="325.0" y="317.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f1e2e">Both green</text>
<text x="325.0" y="337.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">"assert true" would pass here too</text>
<text x="320" y="395" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13"  fill="#625d73">tests inside the box can drift toward the code they test</text>
<rect x="640" y="120" width="290" height="330" rx="16" fill="#fff1e6" stroke="#ff7a1a" stroke-width="2"/>
<text x="785" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#aa4300">SEALED · outside the codebase</text>
<rect x="670" y="185" width="230" height="54" rx="12" fill="#fff1e6" stroke="#ff7a1a" stroke-width="1.5"/>
<text x="785.0" y="209.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1f1e2e">User story 1</text>
<text x="785.0" y="229.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">end-to-end</text>
<rect x="670" y="250" width="230" height="54" rx="12" fill="#fff1e6" stroke="#ff7a1a" stroke-width="1.5"/>
<text x="785.0" y="274.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1f1e2e">User story 2</text>
<text x="785.0" y="294.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">end-to-end</text>
<rect x="670" y="315" width="230" height="54" rx="12" fill="#fff1e6" stroke="#ff7a1a" stroke-width="1.5"/>
<text x="785.0" y="339.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1f1e2e">User story n</text>
<text x="785.0" y="359.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625d73">never shown to agents</text>
<text x="785" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13"  fill="#1f1e2e">score: what fraction of runs</text>
<text x="785" y="428" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13"  fill="#1f1e2e">satisfied the user, not pass / fail</text>
<path d="M640 290L575 290" fill="none" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ao)"/>
<text x="607" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11"  fill="#aa4300">read only</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14"  fill="#1f1e2e">Like a holdout set in machine learning: the thing you optimise against is not the thing you measure with.</text>
<text x="500" y="586" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#aa4300">SCENARIOS OUTSIDE · SCORED AS SATISFACTION · AGENTS NEVER SEE THEM</text>
</svg>
