name: Slide visual check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pinned Playwright
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve dist
        run: |
          python3 -m http.server 8080 --directory dist > /tmp/aetherlink-http.log 2>&1 &
          echo $! > /tmp/aetherlink-http.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/aetherlink-http.log
          exit 1

      - name: Run slide regression
        run: node work/shoot.js work/shots

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-check-artifacts
          path: work/shots/
          if-no-files-found: warn

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/aetherlink-http.pid ]; then kill "$(cat /tmp/aetherlink-http.pid)" || true; fi
